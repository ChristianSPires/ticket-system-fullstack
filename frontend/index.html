<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket System</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="container">
    <header>
        <h1>Ticket System</h1>
        <p>Manage technical support tickets</p>
    </header>

    <section class="card">
        <h2>Create Ticket</h2>

        <form id="ticket-form">
            <div class="form-group">
                <label for="title">Title</label>
                <input id="title" type="text" placeholder="Enter ticket title" required>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" placeholder="Enter ticket description" required></textarea>
            </div>

            <button type="submit">Create Ticket</button>
        </form>

        <div id="feedback" class="feedback hidden"></div>
    </section>

    <section class="card">
        <div class="section-header">
            <h2>Tickets</h2>
            <button id="reload-button" type="button">Reload</button>
        </div>

        <div id="tickets-container" class="tickets-container">
            <p>Loading tickets...</p>
        </div>
    </section>
</div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
